services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: device_as_mcp
      POSTGRES_USER: device_as_mcp
      POSTGRES_PASSWORD: device_as_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U device_as_mcp -d device_as_mcp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: device_as_mcp
      RABBITMQ_DEFAULT_PASS: device_as_mcp
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/device_as_mcp
      DATABASE_USER: device_as_mcp
      DATABASE_PASSWORD: device_as_mcp
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://device_as_mcp:device_as_mcp@rabbitmq:5672
      DEVICE_AS_MCP_PUBLIC_URL: http://localhost:8080
      DEVICE_AS_MCP_FRONTEND_URL: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
