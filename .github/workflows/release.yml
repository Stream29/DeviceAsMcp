name: Release native daemon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify project
        run: >-
          ./gradlew --stacktrace
          :shared:jvmTest
          :shared:linuxX64Test
          :server:test
          :daemon:compileKotlinLinuxX64
          :web:wasmJsBrowserDistribution
      - name: Validate POSIX installer
        run: sh -n install/install-device-as-mcp.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            task: :daemon:linkReleaseExecutableLinuxX64
            source: daemon/build/bin/linuxX64/releaseExecutable/daemon.kexe
            binary: device-as-mcp
            archive: device-as-mcp-linux-x64.tar.gz
            format: tar.gz
          - runner: ubuntu-24.04
            task: :daemon:linkReleaseExecutableLinuxArm64
            source: daemon/build/bin/linuxArm64/releaseExecutable/daemon.kexe
            binary: device-as-mcp
            archive: device-as-mcp-linux-arm64.tar.gz
            format: tar.gz
          - runner: macos-14
            task: :daemon:linkReleaseExecutableMacosArm64
            source: daemon/build/bin/macosArm64/releaseExecutable/daemon.kexe
            binary: device-as-mcp
            archive: device-as-mcp-macos-arm64.tar.gz
            format: tar.gz
          - runner: windows-2025
            task: :daemon:linkReleaseExecutableMingwX64
            source: daemon/build/bin/mingwX64/releaseExecutable/daemon.exe
            binary: device-as-mcp.exe
            archive: device-as-mcp-windows-x64.zip
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build native executable
        shell: bash
        run: ./gradlew --stacktrace "${{ matrix.task }}"
      - name: Validate Windows installer
        if: matrix.format == 'zip'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "install/install-device-as-mcp.ps1"),
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "PowerShell installer syntax validation failed."
          }
      - name: Stage POSIX release archive
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "${{ matrix.source }}" "dist/package/${{ matrix.binary }}"
          chmod 755 "dist/package/${{ matrix.binary }}"
          tar -C dist/package -czf "dist/${{ matrix.archive }}" "${{ matrix.binary }}"
          test "$(tar -tzf "dist/${{ matrix.archive }}")" = "${{ matrix.binary }}"
      - name: Stage Windows release archive
        if: matrix.format == 'zip'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist/package" | Out-Null
          Copy-Item "${{ matrix.source }}" "dist/package/${{ matrix.binary }}"
          Compress-Archive `
              -LiteralPath "dist/package/${{ matrix.binary }}" `
              -DestinationPath "dist/${{ matrix.archive }}"
          Expand-Archive `
              -LiteralPath "dist/${{ matrix.archive }}" `
              -DestinationPath "dist/verify"
          $files = @(Get-ChildItem -LiteralPath "dist/verify" -File -Recurse)
          $directories = @(Get-ChildItem -LiteralPath "dist/verify" -Directory -Recurse)
          $expectedPath = Join-Path (Resolve-Path "dist/verify").Path "${{ matrix.binary }}"
          if ($files.Count -ne 1 -or $directories.Count -ne 0 -or $files[0].FullName -ne $expectedPath) {
              throw "Unexpected Windows archive contents."
          }
      - name: Upload compressed daemon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download compressed daemons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Stage installers and checksums
        run: |
          cp install/install-device-as-mcp.sh dist/
          cp install/install-device-as-mcp.ps1 dist/
          chmod 755 dist/install-device-as-mcp.sh
          (
            cd dist
            sha256sum \
              device-as-mcp-*.tar.gz \
              device-as-mcp-*.zip \
              install-device-as-mcp.* \
              > SHA256SUMS
          )
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "DeviceAsMcp $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
