name: Release native daemon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify project
        run: >-
          ./gradlew --stacktrace
          :shared:jvmTest
          :shared:linuxX64Test
          :server:test
          :daemon:compileKotlinLinuxX64
          :web:wasmJsBrowserDistribution

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            task: :daemon:linkReleaseExecutableLinuxX64
            source: daemon/build/bin/linuxX64/releaseExecutable/daemon.kexe
            asset: device-as-mcp-linux-x64
          - runner: ubuntu-24.04-arm
            task: :daemon:linkReleaseExecutableLinuxArm64
            source: daemon/build/bin/linuxArm64/releaseExecutable/daemon.kexe
            asset: device-as-mcp-linux-arm64
          - runner: macos-14
            task: :daemon:linkReleaseExecutableMacosArm64
            source: daemon/build/bin/macosArm64/releaseExecutable/daemon.kexe
            asset: device-as-mcp-macos-arm64
          - runner: windows-2025
            task: :daemon:linkReleaseExecutableMingwX64
            source: daemon/build/bin/mingwX64/releaseExecutable/daemon.exe
            asset: device-as-mcp-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build native executable
        shell: bash
        run: ./gradlew --stacktrace "${{ matrix.task }}"
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.source }}" "dist/${{ matrix.asset }}"
      - name: Upload native executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download native executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Stage installers and checksums
        run: |
          cp install/install-device-as-mcp.sh dist/
          cp install/install-device-as-mcp.ps1 dist/
          chmod 755 dist/install-device-as-mcp.sh
          (
            cd dist
            sha256sum device-as-mcp-* install-device-as-mcp.* > SHA256SUMS
          )
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "DeviceAsMcp $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
